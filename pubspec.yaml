name: dio_curl_interceptor
description: A Dio interceptor that converts HTTP requests to cURL commands, with pluggable sinks, UI viewer, caching, and webhook integration.
version: 4.0.1
homepage: https://github.com/venhdev/dio_curl_interceptor
repository: https://github.com/venhdev/dio_curl_interceptor

topics:
  - curl
  - dio
  - logging
  - console
  - monitor

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.5.0+1
  colored_logger: ^2.1.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.6
  crypto: ^3.0.7
  share_plus: ^13.0.0
  type_caster: ^0.1.4
  logging: ^1.2.0

dev_dependencies:
  http_parser: ^4.0.2
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.9
  hive_generator: ^2.0.1
  mockito: ^5.4.4

flutter:
