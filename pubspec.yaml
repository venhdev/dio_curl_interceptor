name: dio_curl_interceptor
description: A Dio interceptor that converts HTTP requests to cURL commands, with pluggable sinks, UI viewer, caching, path filtering, and webhook integration.
version: 4.1.0-beta.1
homepage: https://github.com/venhdev/dio_curl_interceptor
repository: https://github.com/venhdev/dio_curl_interceptor

topics:
  - curl
  - dio
  - logging
  - console
  - monitor

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.5.0+1
  colored_logger: ^2.1.1
  hive_ce: ^2.20.2
  hive_ce_flutter: ^2.4.0
  path_provider: ^2.1.6

  flutter_secure_storage: ">=8.0.0 <12.0.0"
  share_plus: ^13.0.0
  shared_preferences: ^2.5.3
  type_caster: ^0.1.4
  logging: ^1.2.0

dev_dependencies:
  http_parser: ^4.0.2
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.9
  hive_ce_generator: ">=1.4.0 <2.0.0"
  mockito: ^5.4.4

flutter:
